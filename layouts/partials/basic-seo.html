<!-- SEO Meta Tags -->
<meta name="description" content="{{ .Summary | default .Site.Params.metadata.description | plainify | truncate 160 }}">

<!-- Open Graph Meta Tags -->
<meta property="og:title" content="{{ .Title | default .Site.Title }}">
<meta property="og:description" content="{{ .Summary | default .Site.Params.metadata.description | plainify | truncate 160 }}">
<meta property="og:url" content="{{ .Permalink }}">
<meta property="og:type" content="{{ if .IsHome }}website{{ else }}article{{ end }}">
{{ with .Params.image }}<meta property="og:image" content="{{ . | absURL }}">{{ end }}
{{ with .Site.Params.metadata.image }}<meta property="og:image" content="{{ . | absURL }}">{{ end }}

<!-- Twitter Card Meta Tags -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ .Title | default .Site.Title }}">
<meta name="twitter:description" content="{{ .Summary | default .Site.Params.metadata.description | plainify | truncate 160 }}">
{{ with .Params.image }}<meta name="twitter:image" content="{{ . | absURL }}">{{ end }}
{{ with .Site.Params.metadata.image }}<meta name="twitter:image" content="{{ . | absURL }}">{{ end }}

<!-- Canonical URL -->
<link rel="canonical" href="{{ .Permalink }}">

<!-- Keywords (if defined) -->
{{ with .Site.Params.metadata.keywords }}<meta name="keywords" content="{{ delimit . ", " }}">{{ end }}

<!-- Author -->
{{ with .Site.Params.metadata.author }}<meta name="author" content="{{ . }}">{{ end }}
