#################### default parameters ################################
# favicon
favicon = "images/favicon.png"
# logo
logo = "images/logo.png"
logo_other = "images/logo-other.png"

logo_darkmode = "images/logo-other.png"
# use `px` or `x` with logo_width, example: "100px".
# Note: logo_width is not work with .svg file
logo_width = "216px"
# if logo_webp set false, will not generate WEBP version of logo | default is true
logo_webp = true
# logo text will only show when logo is missing.
logo_text = "AIMS Ghana"
# theme-mode
theme_switcher = false
theme_default = "system" # available options [light/dark/system]
# Main Sections
mainSections = ["news"]
# contact form action
contact_form_action = "#!" # contact form works with [https://airform.io/] or [https://formspree.io]
# demo form action
demo_form_action = "#!" # demo form works with [https://airform.io/] or [https://formspree.io]
# career form action
career_form_action = "#"
# google tag manager, see https://developers.google.com/tag-manager/
google_tag_manager = "" # example: G-XXXXXXXXXX
# custom script on header, example: custom_script= "<script>console.log(\"Hello World\")</script>" 
custom_script = ""
# copyright
theme_copyright = true
copyright = "&copy; 2026 AIMS Ghana. All Rights Reserved."
footer_tagline_first = "Africa’s Youth"
footer_tagline_second = "The Future of Science"
footer_donate_label = "Donate"
footer_donate_link = "donate/"
footer_organization = "African Institute for Mathematical Sciences"

# Footer link-column headings, per the Figma Footer component.
footer_menu_explore = "Explore"
footer_menu_quick = "Quick links"
footer_menu_connect = "Connect"
footer_menu_centres = "Centres"

# Contact lines, shown inside the left-hand block under the description.
# telephone is intentionally empty: the spec carries "[Approved main telephone
# number]" as a placeholder and the design shows no phone line, so nothing is
# invented here and the row stays hidden until a real number is supplied.
[footer_contact]
location = "Kasa Global Villa, 1 Shoppers Street, Manet, Spintex, Accra, Ghana"
telephone = ""
email = "info@aims.edu.gh"

############################# social site ########################
# Verified AIMS Ghana social profiles shown in the footer across the site.
[[social]]
title = "X"
icon = "fab fa-x-twitter"
image = "images/footer/x.svg"
link = "https://x.com/AIMSGhana"

[[social]]
title = "Facebook"
icon = "fab fa-facebook"
image = "images/footer/facebook.svg"
link = "https://www.facebook.com/AIMSGH"

[[social]]
title = "LinkedIn"
icon = "fab fa-linkedin"
image = "images/footer/linkedin.svg"
link = "https://www.linkedin.com/company/aims-ghana/"

[[social]]
title = "YouTube"
icon = "fab fa-youtube"
image = "images/footer/youtube.svg"
link = "https://www.youtube.com/channel/UC219D5ltAO-htICtCeiEdng"

[[social]]
title = "Instagram"
icon = "fab fa-instagram"
image = "images/footer/instagram.svg"
link = "https://www.instagram.com/aimsghana/"

# ---------------------------------------------------------------------
# Restored: these blocks were dropped when the footer params were
# rewritten in b5825ca. Hugo renders nothing for a missing param rather
# than erroring, so the build stayed green while the nav CTA, the SEO
# metadata and the cookie banner had all silently stopped rendering.
# ---------------------------------------------------------------------

[preloader]
enable = true
preloader = "" # use jpg, png, svg or gif format. example - "images/preloader.gif"

# Navigation button

# Main-bar call to action. Donate moved to the utility strip when the two-tier
# navigation landed, so the primary button now points at admissions.
[navigation_button]
enable = true
label = "Apply"
link = "training/admissions/"

# crisp chat
# crisp chat module: https://github.com/gethugothemes/hugo-modules/tree/master/components/crisp-chat

[crisp_chat]
enable = false
crisp_website_id = "9aa449e1-9999-422a-938f-8567982eec6d" # replace this code with yours
# Check this video tutorial to get your crisp website ID - https://www.youtube.com/watch?v=nW5UX6iVdFc

# seo meta data for OpenGraph / Twitter Card

[metadata]
keywords = ["AIMS Ghana", "mathematical sciences", "Africa", "master's programme", "African Institute", "education", "research"]
description = "AIMS Ghana empowers Africa's brightest minds in mathematical sciences through world-class training, research, and mentorship. Apply to our transformative master's programme."
author = "AIMS Ghana"
image = "images/logo.png"                           # this image will be used as fallback if a page has no image of its own

# matomo tracking: see https://matomo.org/
# matomo tracking module: https://github.com/gethugothemes/hugo-modules/tree/master/seo-tools/matomo-analytics

[matomo]
enable = false
url = ""       # your matomo url
id = ""        # your matomo id

# baidu analytics: see https://tongji.baidu.com/
# baidu analytics module: https://github.com/gethugothemes/hugo-modules/tree/master/seo-tools/baidu-analytics

[baidu]
enable = false
analytics_id = "" # Your ID

# plausible analytics: see https://plausible.io/
# plausible analytics module: https://github.com/gethugothemes/hugo-modules/tree/master/seo-tools/plausible-analytics

[plausible]
enable = false
domain = ""    # yourdomain.com

# counter analytics: see https://counter.dev/setup.html
# counter analytics module: https://github.com/gethugothemes/hugo-modules/tree/master/seo-tools/counter-analytics

[counter]
enable = false
username = ""  # your username

# site verifications
# site verifications module: https://github.com/gethugothemes/hugo-modules/tree/master/seo-tools/site-verifications

[site_verification]
google = ""   # Your verification code
bing = ""     # Your verification code
baidu = ""    # Your verification code
facebook = "" # Your verification code
mastodon = "" # Your verification code

# cookies
# cookies module: https://github.com/gethugothemes/hugo-modules/tree/master/components/cookie-consent

[cookies]
enable = true
expire_days = 2
content = "This site uses cookies. By continuing to use this website, you agree to their use."
button = "I Accept"

